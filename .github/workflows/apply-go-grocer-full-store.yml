name: Apply GO GROCER full-store theme

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-go-grocer-full-store.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme-development
        uses: actions/checkout@v4
        with:
          ref: theme-development
          fetch-depth: 0

      - name: Apply GO GROCER theme overlay
        shell: bash
        run: |
          cat > /tmp/go-grocer-patch.b64 <<'PATCH_B64'
[... ELLIPSIZATION ...]
PATCH_B64
          base64 -d /tmp/go-grocer-patch.b64 > /tmp/go-grocer-patch.tar.gz
          echo "875071a2d09875c9e0992e49df386eae6d450cd011617f532e60a3dc43ba558e  /tmp/go-grocer-patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/go-grocer-patch.tar.gz -C .
          rm -f GO-GROCER-CUSTOMIZATION-STATUS.md

      - name: Commit GO GROCER full-store theme
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/go-store.css \
            sections/go-about-page.liquid \
            sections/go-collection-page.liquid \
            sections/go-contact-page.liquid \
            sections/go-faq-page.liquid \
            sections/go-footer.liquid \
            sections/go-homepage.liquid \
            sections/go-product-page.liquid \
            sections/go-protein-day-page.liquid \
            sections/go-recipe-page.liquid \
            sections/go-recipes-page.liquid \
            templates/article.recipe.json \
            templates/blog.recipes.json \
            templates/page.about-go-grocer.json \
            templates/page.build-your-protein-day.json \
            templates/page.faq.json \
            templates/page.go-contact.json \
            config/settings_data.json \
            layout/theme.liquid \
            sections/footer-group.json \
            sections/header-group.json \
            templates/collection.json \
            templates/index.json \
            templates/product.json
          git rm -f GO-GROCER-CUSTOMIZATION-STATUS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "GO GROCER overlay already applied."
            exit 0
          fi
          git commit -m "feat: apply GO GROCER full-store Horizon theme"
          git push origin HEAD:theme-development
