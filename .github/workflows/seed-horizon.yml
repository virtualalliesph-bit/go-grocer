name: Seed Horizon 4.2.0 theme

on:
  push:
    branches:
      - theme-development
    paths:
      - .github/workflows/seed-horizon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme-development
        uses: actions/checkout@v4
        with:
          ref: theme-development
          fetch-depth: 0

      - name: Seed Shopify Horizon 4.2.0
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          git clone https://github.com/Shopify/horizon.git "$tmp_dir/horizon"
          git -C "$tmp_dir/horizon" checkout 5acd1b6b66c02f61d3216e3adace5dd9e0404fc9
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$tmp_dir/horizon/" ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Theme already seeded."
            exit 0
          fi

          git commit -m "chore: seed Shopify Horizon 4.2.0 base"
          git push origin HEAD:theme-development
